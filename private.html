<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://wyxzgxjvyaaxgkqzrnuz.supabase.co; base-uri 'none'; form-action 'self'"><title>QLab Private</title>
<style>:root{color-scheme:dark;--b:#0b1016;--p:#111923;--l:#293744;--f:#eaf0f5;--m:#9aafbe;--a:#91e0c5}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--f);font:14px/1.55 system-ui,"Malgun Gothic",sans-serif}.w{max-width:1000px;margin:auto;padding:36px 18px}h1{font-size:25px}form,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px;margin:14px 0}input,button{font:inherit;border-radius:7px;padding:10px 12px}input{display:block;width:100%;margin:8px 0;background:var(--b);border:1px solid var(--l);color:var(--f)}button{border:0;background:var(--a);color:#10201c;font-weight:700;cursor:pointer}.mut{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.row{cursor:pointer}.row:hover{border-color:var(--a)}dialog{background:var(--p);color:var(--f);border:1px solid var(--l);border-radius:12px;max-width:520px;width:calc(100% - 30px)}dialog::backdrop{background:#000b}dl{display:grid;grid-template-columns:auto 1fr;gap:7px 15px}dd{margin:0}#app[hidden],#login[hidden]{display:none}</style></head><body><main class="w">
<h1>QLab 비공개 추적 신호</h1><p class="mut">승인된 계정만 현재 보유 종목과 진입 정보를 조회할 수 있습니다.</p>
<form id="login"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button><p id="error" class="mut" role="alert"></p></form>
<section id="app" hidden><p><button id="logout">로그아웃</button></p><h2 id="count">추적 신호</h2><div id="signals" class="grid"></div></section>
<dialog id="detail"><button id="close" aria-label="닫기">닫기</button><h2 id="title"></h2><dl id="fields"></dl></dialog></main>
<script>const URL='https://wyxzgxjvyaaxgkqzrnuz.supabase.co',KEY='sb_publishable_goMuNNp01oYx_hLqlK2eCw_JxAhnWr3',login=document.querySelector('#login'),app=document.querySelector('#app'),err=document.querySelector('#error');let token='';
const esc=v=>String(v??'확인 불가');async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function show(rows){document.querySelector('#count').textContent='추적 신호 '+rows.length+'건';const box=document.querySelector('#signals');box.replaceChildren();for(const r of rows){const c=document.createElement('article');c.className='card row';c.innerHTML='<b></b><p class="mut"></p>';c.querySelector('b').textContent=esc(r.ticker);c.querySelector('p').textContent=esc(r.market)+' · 진입 '+esc(r.entry_date)+' · '+esc(r.alast_status);c.onclick=()=>detail(r);box.append(c)}}
function detail(r){document.querySelector('#title').textContent=esc(r.ticker);const f=document.querySelector('#fields');f.replaceChildren();for(const [k,v] of [['시장',r.market],['진입일',r.entry_date],['상태',r.alast_status],['추가매수 횟수',r.buys],['추적 일수',r.day],['진입 대비 수익률',r.ret_from_entry_pct],['최근 데이터',r.as_of]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=esc(v);f.append(dt,dd)}document.querySelector('#detail').showModal()}
login.onsubmit=async e=>{e.preventDefault();err.textContent='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});token=d.access_token;const rows=await api('/rest/v1/active_signals?select=ticker,market,entry_date,alast_status,buys,day,ret_from_entry_pct,as_of&covered=eq.true&alast_status=eq.%EB%B3%B4%EC%9C%A0%EC%A4%91&order=entry_date.desc');login.hidden=true;app.hidden=false;show(rows)}catch(e){token='';err.textContent='로그인 또는 조회 권한을 확인할 수 없습니다.'}};
document.querySelector('#logout').onclick=()=>location.reload();document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();</script></body></html>
