<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://wyxzgxjvyaaxgkqzrnuz.supabase.co; base-uri 'none'; form-action 'self'"><title>QLab Private</title>
<style>:root{color-scheme:dark;--b:#080d14;--p:#111923;--p2:#17222e;--l:#263442;--f:#edf4f8;--m:#91a4b3;--a:#65d6b3;--blue:#67aefb;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#173047 0,var(--b) 38%);color:var(--f);font:14px/1.55 system-ui,"Malgun Gothic",sans-serif}.w{max-width:1120px;margin:auto;padding:44px 20px 80px}.eyebrow{color:var(--a);font-weight:800;letter-spacing:.12em;font-size:11px}h1{font-size:30px;letter-spacing:-.04em;margin:5px 0}.mut{color:var(--m)}form,.card,dialog{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--l);box-shadow:0 16px 42px #0004}form{max-width:460px;border-radius:18px;padding:24px;margin:24px 0}input,button{font:inherit;border-radius:9px;padding:11px 13px}input{display:block;width:100%;margin:8px 0 15px;background:var(--b);border:1px solid var(--l);color:var(--f)}button{border:1px solid transparent;background:var(--a);color:#082119;font-weight:750;cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:14px}.card{border-radius:15px;padding:18px}.row{cursor:pointer;transition:.18s}.row:hover{border-color:var(--a);transform:translateY(-2px)}.top{display:flex;justify-content:space-between;gap:8px}.market,.chip{background:#ffffff0b;border:1px solid var(--l);border-radius:6px;padding:2px 7px;font-size:11px}.ret{font-size:23px;font-weight:800;margin:16px 0 3px}.pos{color:var(--a)}.neg{color:var(--red)}dialog{border-radius:18px;max-width:680px;width:calc(100% - 30px);color:var(--f);padding:24px}dialog::backdrop{background:#02060bd9}.close{float:right;background:transparent;color:var(--m);border-color:var(--l)}.chart{width:100%;height:190px;background:#ffffff08;border:1px solid var(--l);border-radius:12px;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#ffffff08;border:1px solid var(--l);border-radius:10px;padding:12px}.metric b{display:block;font-size:17px;margin-top:4px}#app[hidden],#login[hidden]{display:none}@media(max-width:600px){.metrics{grid-template-columns:1fr}.w{padding:26px 14px}}</style></head><body><main class="w">
<div class="eyebrow">QLAB · PRIVATE MONITOR</div><h1>비공개 추적 신호</h1><p class="mut">승인된 계정만 현재 보유 종목과 실제 확정봉 경로를 조회할 수 있습니다.</p>
<form id="login"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button><p id="error" class="mut" role="alert"></p></form>
<section id="app" hidden><div class="toolbar"><h2 id="count">추적 신호</h2><button id="logout">로그아웃</button></div><div id="signals" class="grid"></div></section>
<dialog id="detail"><button id="close" class="close" aria-label="닫기">닫기</button><div class="eyebrow">LIVE POSITION</div><h2 id="title"></h2><p id="subtitle" class="mut"></p><div id="chart"></div><div id="fields" class="metrics"></div></dialog></main>
<script>const URL='https://wyxzgxjvyaaxgkqzrnuz.supabase.co',KEY='sb_publishable_goMuNNp01oYx_hLqlK2eCw_JxAhnWr3',login=document.querySelector('#login'),app=document.querySelector('#app'),err=document.querySelector('#error');let token='';
const esc=v=>String(v??'확인 불가');async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function apiAll(path){let out=[];for(let from=0;;from+=1000){const batch=await api(path,{headers:{Range:from+'-'+(from+999)}});out=out.concat(batch);if(batch.length<1000)return out}}
function pct(v){return typeof v==='number'?(v>=0?'+':'')+v.toFixed(2)+'%':'확인 불가'}
function graph(path){if(!Array.isArray(path)||path.length<2)return '<div class="card mut">확정 일봉 경로를 아직 확인할 수 없습니다.</div>';const W=620,H=190,P=28,rs=path.map(x=>Number(x.ret)),ds=path.map(x=>Number(x.day)),mn=Math.min(...rs,0),mx=Math.max(...rs,0),sp=mx-mn||1,dm=Math.max(...ds,1),X=d=>P+d/dm*(W-2*P),Y=v=>P+(mx-v)/sp*(H-2*P),pts=path.map(x=>X(x.day)+','+Y(x.ret)).join(' '),last=path[path.length-1];return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="진입가 대비 일별 수익률"><line x1="'+P+'" y1="'+Y(0)+'" x2="'+(W-P)+'" y2="'+Y(0)+'" stroke="var(--l)" stroke-dasharray="4 4"/><polyline points="'+pts+'" fill="none" stroke="var(--blue)" stroke-width="2"/><circle cx="'+X(last.day)+'" cy="'+Y(last.ret)+'" r="4" fill="var(--a)"/><text x="'+(X(last.day)-8)+'" y="'+(Y(last.ret)-10)+'" text-anchor="end" fill="var(--f)" font-size="13">'+pct(last.ret)+'</text></svg>'}
function show(rows){document.querySelector('#count').textContent='추적 신호 '+rows.length+'건';const box=document.querySelector('#signals');box.replaceChildren();for(const r of rows){const c=document.createElement('article');c.className='card row';const rv=typeof r.ret_from_entry_pct==='number'?r.ret_from_entry_pct:null;c.innerHTML='<div class="top"><b></b><span class="market"></span></div><div class="ret '+(rv>=0?'pos':'neg')+'">'+pct(rv)+'</div><p class="mut"></p>';c.querySelector('b').textContent=esc(r.ticker);c.querySelector('.market').textContent=esc(r.market);c.querySelector('p').textContent='진입 '+esc(r.entry_date)+' · '+esc(r.buys)+'차 · '+esc(r.day)+'일';c.onclick=()=>detail(r);box.append(c)}}
function detail(r){document.querySelector('#title').textContent=esc(r.ticker);document.querySelector('#subtitle').textContent=esc(r.market)+' · 진입 '+esc(r.entry_date)+' · 최근 데이터 '+esc(r.as_of);document.querySelector('#chart').innerHTML=graph(r.return_path);const vals=[['상태',r.alast_status],['진입 대비',pct(r.ret_from_entry_pct)],['마지막 매수가 대비',pct(r.cur_ret_pct)],['매수 차수',esc(r.buys)+'차'],['추적 일수',esc(r.day)+'일'],['경로 관측점',Array.isArray(r.return_path)?r.return_path.length+'개':'확인 불가']];document.querySelector('#fields').innerHTML=vals.map(x=>'<div class="metric"><span class="mut">'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('');document.querySelector('#detail').showModal()}
login.onsubmit=async e=>{e.preventDefault();err.textContent='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});token=d.access_token;const rows=await apiAll('/rest/v1/active_signals?select=signal_id,ticker,market,entry_date,alast_status,buys,day,cur_ret_pct,ret_from_entry_pct,as_of&covered=eq.true&alast_status=eq.%EB%B3%B4%EC%9C%A0%EC%A4%91&order=entry_date.desc');const paths=await apiAll('/rest/v1/signal_return_paths?select=signal_id,return_path&path_scope=eq.ACTIVE');const pm=new Map(paths.map(x=>[x.signal_id,x.return_path]));rows.forEach(x=>x.return_path=pm.get(x.signal_id)||null);login.hidden=true;app.hidden=false;show(rows)}catch(e){token='';err.textContent='로그인 또는 조회 권한을 확인할 수 없습니다.'}};
document.querySelector('#logout').onclick=()=>location.reload();document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();</script></body></html>
